apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: nginx-traefik
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-gateway"
    nginx.ingress.kubernetes.io/proxy-body-size: 600m
    nginx.org/client-max-body-size: 600m
{{- if .Values.webauth }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Release.Name }}-web
{{- end }}
spec:
  ingressClassName: nginx-traefik
  tls:
    - hosts:
        - {{ include "dns.name" . }}
      secretName: {{ include "secret.name" . }}
  rules:
  - host: {{ include "dns.name" . }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Release.Name }}
            port: 
              name: bolt
      - pathType: Prefix
        path: "/browser"
        backend:
          service: 
            name: {{ .Release.Name }}
            port:
              name: web
