{{- if not .Values.db.auth.existingSecret }}
{{/*
With db.auth.retain the Secret is kept on uninstall, so a retained database
volume does not end up with an unknown password.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orthovenn.db.secretName" . }}
  labels:
    {{- include "orthovenn.labels" . | nindent 4 }}
  {{- if .Values.db.auth.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{ .Values.db.auth.secretKey }}: {{ include "orthovenn.db.password" . | b64enc | quote }}
{{- end }}
