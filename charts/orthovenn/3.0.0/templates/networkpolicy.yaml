{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orthovenn.fullname" . }}
  labels:
    {{- include "orthovenn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "orthovenn.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Traefik on the frontend port, and the cert-manager ACME HTTP-01 challenge.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.web.port }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.acmeChallengePort }}
    # The api container reaches MySQL through the Service, so the pod also
    # receives its own traffic on the database and API ports.
    - from:
        - podSelector:
            matchLabels:
              {{- include "orthovenn.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.db.port }}
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
