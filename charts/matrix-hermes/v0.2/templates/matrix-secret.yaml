{{- if .Values.matrixEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrix-hermes.fullname" . }}-env
type: Opaque
stringData:
{{- range $line := splitList "\n" .Values.matrixEnv }}
{{- $l := trim $line }}
{{- if and $l (not (hasPrefix "#" $l)) (contains "=" $l) }}
{{- $kv := splitn "=" 2 $l }}
  {{ trim $kv._0 }}: {{ trim $kv._1 | trimAll "\"'" | quote }}
{{- end }}
{{- end }}
{{- end }}
