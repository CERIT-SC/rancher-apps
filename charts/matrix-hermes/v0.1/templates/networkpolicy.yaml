{{- if eq .Values.k8sApiAccess "none" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "matrix-hermes.fullname" . }}-deny-k8s-api
  labels:
    {{- include "matrix-hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "matrix-hermes.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
        - ipBlock:
            cidr: ::/0
            except:
              - 2001:718:801:42cb:8::/80
{{- end }}
